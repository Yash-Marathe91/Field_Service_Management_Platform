# Spring Application Configuration
spring.application.name=keystone

# Server Port (supports cloud dynamic port like Render/Railway/Heroku)
server.port=${PORT:8080}

# Database Connection (PostgreSQL) - local default with cloud environment override
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keystone_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configurations
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a2f8c7e6d5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jackson JSON Formatter
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

